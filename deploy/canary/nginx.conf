# Canary traffic split: ~90% stable, ~10% canary (weights 9:1).
# Change the weights and reload to shift traffic; weight=0 is not allowed in an upstream,
# so to roll back fully, mark the canary server `down`.
upstream rag {
    server bento_stable:8000 weight=9;
    server bento_canary:8000 weight=1;
    # rollback: server bento_canary:8000 down;
}

server {
    listen 80;

    location / {
        proxy_pass http://rag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;          # keep /ask_stream tokens flowing
        proxy_read_timeout 120s;
        add_header X-Served-By $upstream_addr always;   # which version answered
    }
}