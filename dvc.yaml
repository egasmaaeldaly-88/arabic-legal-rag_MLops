stages:
  build_corpus:
    cmd: python src/arabic_legal_rag/build_corpus.py
    deps:
      - data/egyptian_civil_code.pdf
      - src/arabic_legal_rag/build_corpus.py
    outs:
      - data/legal_corpus_structured.json:
          cache: false

  validate_corpus:
    cmd: python src/arabic_legal_rag/validate_corpus.py
    deps:
      - src/arabic_legal_rag/validate_corpus.py
      - data/legal_corpus_structured.json
    outs:
      - outputs/validation.flag

  export_onnx:
    cmd: python export_to_onnx.py
    deps:
      - export_to_onnx.py
    outs:
      - models/onnx/:
          push: false

  build_index:
    cmd: python src/arabic_legal_rag/ingest.py
    deps:
      - src/arabic_legal_rag/ingest.py
      - data/legal_corpus_structured.json
      - outputs/validation.flag
    outs:
      - data/vector_store_bgem3/

  train_model_families:
    cmd: python -m src.arabic_legal_rag.train_families
    deps:
      - src/arabic_legal_rag/train_families.py
      - data/eval_dataset.json
      - data/vector_store_bgem3/
    outs:
      - outputs/evaluation_report_Baseline_MiniLM.json
      - outputs/evaluation_report_Alternative_Model.json
      - outputs/evaluation_report_Optimal_BGE_M3.json

  optuna_sweep:
    cmd: python -m src.arabic_legal_rag.optuna_sweep
    deps:
      - src/arabic_legal_rag/optuna_sweep.py
      - data/eval_dataset.json
    outs:
      - outputs/optuna_best_params.json

  evaluate:
    cmd: python -m arabic_legal_rag.eval
    deps:
      - src/arabic_legal_rag/eval.py
      - data/eval_dataset.json
      - data/vector_store_bgem3/
    outs:
      - outputs/evaluation_report.json

  chunking_sweep:
    cmd: python src/arabic_legal_rag/chunking_sweep.py
    deps:
      - src/arabic_legal_rag/chunking_sweep.py
      - data/eval_dataset.json

  register_best_model:
    cmd: python src/arabic_legal_rag/register_best_model.py
    deps:
      - src/arabic_legal_rag/register_best_model.py
      - outputs/evaluation_report.json
    outs:
      - outputs/best_config_registered.flag