[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Production-grade Arabic Legal RAG System for Egyptian Civil Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.7.4",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-huggingface>=0.0.1",
    "sentence-transformers>=2.5.0",
    "pyyaml>=6.0",
    "mlflow>=2.0.0",
    "loguru>=0.7.3",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "pytest-cov>=4.0.0",
    "dvc>=3.0.0",
    "optuna>=3.0.0",
]
eval = [
    "mlflow>=2.10.0",
    "ragas>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src/arabic_legal_rag --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/arabic_legal_rag/build_corpus.py",
    "src/arabic_legal_rag/eval.py",
    "src/arabic_legal_rag/evaluate_retrieval.py",
    "src/arabic_legal_rag/ingest.py",
    "src/arabic_legal_rag/register_best_model.py",
    "src/arabic_legal_rag/register_model.py",
    "src/arabic_legal_rag/validate_corpus.py",
    "src/arabic_legal_rag/run_experiment.py",
    "src/arabic_legal_rag/conftest.py",
]