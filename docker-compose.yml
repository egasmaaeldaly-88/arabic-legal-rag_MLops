services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: arabic-legal-rag-api:latest
    container_name: arabic_legal_rag_container
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
