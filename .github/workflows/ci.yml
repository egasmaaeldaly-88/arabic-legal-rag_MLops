name: CI/CD Pipeline - Arabic Legal RAG

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

env:
  HF_HOME: ${{ github.workspace }}/.hf_cache

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Set up Astral uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Cache Hugging Face models (bge-m3)
      uses: actions/cache@v4
      with:
        path: .hf_cache
        key: hf-bge-m3-v1

    - name: Install dependencies
      run: |
        uv venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        uv pip install -e ".[dev,eval]" ruff

    - name: Lint (fails the build on errors)
      run: ruff check src tests

    - name: Rebuild index (validate corpus -> embed -> vector store)
      run: dvc repro build_index

    - name: Run tests
      run: pytest -v

    - name: Pull data from DagsHub
      env:
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        dvc remote modify dagshub --local access_key_id "$DAGSHUB_TOKEN"
        dvc remote modify dagshub --local secret_access_key "$DAGSHUB_TOKEN"
        dvc pull data/egyptian_civil_code.pdf.dvc

    - name: RAGAS faithfulness gate (Lightweight check for CI)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GENERATOR_BACKEND: openai
        LLM_BASE_URL: https://api.groq.com/openai/v1
        LLM_MODEL: qwen/qwen3.8-27b
        JUDGE_MODEL: openai/gpt-oss-120b
        JUDGE_MAX_TOKENS: "4000"
        JUDGE_EXTRA_BODY: '{"reasoning_effort":"low"}'
        # --- إضافة إعدادات DagsHub و MLflow ---
        MLFLOW_TRACKING_URI: https://dagshub.com/egasmaaeldaly-88/Dagshub_mlops.mlflow
        MLFLOW_TRACKING_USERNAME: egasmaaeldaly-88
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: >
        python -m arabic_legal_rag.evaluate_ragas
        --num-questions 1 --metrics faithfulness --threshold 0.5

    - name: Upload RAGAS report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ragas-report
        path: reports/
        if-no-files-found: ignore

    - name: Upload vector store for the Docker job
      uses: actions/upload-artifact@v4
      with:
        name: vector-store
        path: data/vector_store_bgem3/

  docker-build-and-push:
    needs: validate-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download vector store built by the previous job
      uses: actions/download-artifact@v4
      with:
        name: vector-store
        path: data/vector_store_bgem3/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/arabic-legal-rag
        tags: |
          type=sha
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build image (not pushed yet)
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        push: false
        tags: arabic-legal-rag:test

    - name: Smoke test the container
      run: |
        docker run -d --name rag -p 8000:8000 \
          -e GENERATOR_BACKEND=extractive arabic-legal-rag:test

        ok=0
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8000/health > health.json; then ok=1; break; fi
          sleep 5
        done
        if [ "$ok" != "1" ]; then
          echo "Container never became healthy"; docker logs rag; exit 1
        fi

        cat health.json
        python3 - <<'PY'
        import json
        d = json.load(open("health.json"))
        assert d["status"] == "healthy", d
        assert d["documents_indexed"] > 0, d
        PY

        curl -sf -X POST http://localhost:8000/ask \
          -H "Content-Type: application/json; charset=utf-8" \
          --data-binary '{"question":"ما هو التزام البائع بالضمان؟"}' > ask.json
        cat ask.json
        python3 - <<'PY'
        import json
        d = json.load(open("ask.json"))
        assert d["answer"].strip(), "empty answer"
        assert d["sources"], "no sources returned"
        PY

        code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/ask \
          -H "Content-Type: application/json" -d '{"question":""}')
        echo "empty question -> HTTP $code"
        [ "$code" = "422" ]

    - name: Validate compose files
      run: |
        docker compose -f docker-compose.yml config -q
        GROQ_API_KEY=dummy docker compose -f docker-compose.groq.yml config -q

    - name: Build and smoke test the BentoML image
      run: |
        docker rm -f rag || true
        docker build -f Dockerfile.bento \
          --build-arg BASE_IMAGE=arabic-legal-rag:test \
          -t arabic-legal-rag-bento:test .
        docker run -d --name bento -p 8000:8000 \
          -e GENERATOR_BACKEND=extractive arabic-legal-rag-bento:test

        ok=0
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8000/readyz > /dev/null; then ok=1; break; fi
          sleep 5
        done
        if [ "$ok" != "1" ]; then
          echo "BentoML never became ready"; docker logs bento; exit 1
        fi

        curl -sf -X POST http://localhost:8000/health \
          -H "Content-Type: application/json" -d '{}' > bento_health.json
        cat bento_health.json
        curl -sf -X POST http://localhost:8000/ask \
          -H "Content-Type: application/json; charset=utf-8" \
          --data-binary '{"question":"ما هو التزام البائع بالضمان؟","top_k":3}' > bento_ask.json
        cat bento_ask.json
        python3 - <<'PY'
        import json
        h = json.load(open("bento_health.json"))
        assert h["status"] == "healthy" and h["documents_indexed"] > 0, h
        a = json.load(open("bento_ask.json"))
        assert a["answer"].strip(), "empty answer"
        assert a["sources"], "no sources returned"
        PY

    - name: BentoML logs (on failure)
      if: failure()
      run: docker logs bento || true

    - name: Container logs (on failure)
      if: failure()
      run: docker logs rag || true

    - name: Push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}