name: CI/CD Pipeline - Arabic Legal RAG

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

env:
  HF_HOME: ${{ github.workspace }}/.hf_cache

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Hugging Face models (bge-m3)
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hf-bge-m3-v1

      - name: Install dependencies
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # CPU-only torch first: avoids pulling multi-GB CUDA wheels onto the runner
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,eval]" ruff

      - name: Lint (fails the build on errors)
        run: ruff check src tests

      - name: Rebuild index (validate corpus -> embed -> vector store)
        # Only the stages CI needs. The full `dvc repro` also runs ONNX export,
        # model sweeps and registration, and the DVC remote is a local Windows path.
        run: dvc repro build_index

      - name: Run tests
        run: pytest -v

      - name: RAGAS faithfulness gate (fails if < 0.75 on 20 questions)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GENERATOR_BACKEND: openai
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: qwen/qwen3.8-27b
          JUDGE_MODEL: openai/gpt-oss-120b
          JUDGE_MAX_TOKENS: "4000"
          JUDGE_EXTRA_BODY: '{"reasoning_effort":"low"}'
        run: >
          python -m arabic_legal_rag.evaluate_ragas
          --num-questions 20 --metrics faithfulness --threshold 0.75

      - name: Upload RAGAS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: reports/
          if-no-files-found: ignore

      - name: Upload vector store for the Docker job
        uses: actions/upload-artifact@v4
        with:
          name: vector-store
          path: data/vector_store_bgem3/

  docker-build-and-push:
    needs: validate-and-test
    # Runs on every push (not on PRs). Branch pushes get a branch/sha tag;
    # `latest` is only moved on main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download vector store built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: vector-store
          path: data/vector_store_bgem3/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arabic-legal-rag
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
